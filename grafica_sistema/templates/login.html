<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - GRÁFICA KL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 flex items-center justify-center h-screen">

    <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md">
        <div class="text-center mb-8">
            <div class="flex justify-center mb-4">
                <i data-lucide="printer" class="text-blue-600 w-12 h-12"></i>
            </div>
            <h1 class="text-2xl font-black text-slate-800 tracking-tighter">GRÁFICA KL</h1>
            <p class="text-slate-500 text-sm">Entre com suas credenciais de acesso</p>
        </div>

        {% if erro %}
        <div class="bg-rose-50 text-rose-600 p-3 rounded-lg text-sm mb-4 border border-rose-100 font-medium">
            {{ erro }}
        </div>
        {% endif %}

        <form action="/login" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Usuário</label>
                <input type="text" name="usuario" required class="w-full p-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Senha</label>
                <input type="password" name="senha" required class="w-full p-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow-lg transition-all">
                Acessar Sistema
            </button>
        </form>
        
        <p class="text-center text-slate-400 text-[10px] mt-8 uppercase font-bold tracking-widest">Acesso Restrito</p>
    </div>

    <script>lucide.createIcons();</script>
</body>
</html>
